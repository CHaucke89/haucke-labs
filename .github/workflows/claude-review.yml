name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

# A new push supersedes the review of the previous commit.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, forks and Dependabot: none of them can read repo secrets, so
    # the action would fail. Dependabot bumps are already covered by CI.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write # the action exchanges an OIDC token for its GitHub App token
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out.
            This is a SvelteKit (Svelte 5) site deployed to Cloudflare Workers,
            checked with `svelte-check` and built with Vite.

            Focus on:
            - Real bugs and logic errors
            - Svelte 5 correctness (runes, reactivity, SSR/hydration pitfalls)
            - Cloudflare Workers runtime constraints (no Node-only APIs at request time)
            - Security issues (XSS via {@html}, leaked secrets, unsafe fetches)
            - Accessibility problems in markup

            Skip style nitpicks and anything CI (`pnpm check`, `pnpm build`)
            already catches. Be concise. If the PR looks good, say so in one line.

            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for issues tied to specific lines, and
            `gh pr comment` for a short overall summary. Only post GitHub
            comments; do not output review text as a message.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
